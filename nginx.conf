map $request_uri $robots_tag {
    default "noindex, follow";
    ~^/(\?.*)?$ "index, follow";
}

server {
    listen 5273;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Styles remain inline for React/MUI; executable inline scripts are blocked.
    # Production API requests use the same-origin /api proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_tag always;

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html { return 301 /; }

    # Never turn a missing sitemap or asset into a successful HTML response.
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location ~ /\. { return 404; }
    location ~* \.(env|ini|log|sql|bak|map)$ { return 404; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Página de manutenção para falhas no backend
    error_page 502 503 504 /error_pages/502.html;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /app.html;
        expires -1;
    }

    # Bloqueia acesso direto a pasta error_pages caso o usuário tente acessar pela URL
    location ^~ /error_pages/ {
        internal;
        root /usr/share/nginx/html;
    }

    location /api {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://backend:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        default_type text/plain;
    }
}
