services:
  db:
    image: postgres:15-alpine
    container_name: myteacher_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-student_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-student_management}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: myteacher_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-student_management}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:8501/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUPPORT_WHATSAPP_NUMBER: ${VITE_SUPPORT_WHATSAPP_NUMBER:-5521974546156}
    container_name: myteacher_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5273:5273"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5273/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: myteacher_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5150:80"
    depends_on:
      - db
    volumes:
      - ./database/servers.json:/pgadmin4/servers.json
    networks:
      - app_network
    profiles:
      - tools

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
